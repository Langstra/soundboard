<header class="app-settings__header">
  <h1 class="app-settings__title">Instellingen</h1>

  <a class="app-settings__back" routerLink="/">Terug</a>
</header>

<main class="app-settings__body">
  <section class="app-settings__section" aria-labelledby="spotify-heading">
    <h2 class="app-settings__heading" id="spotify-heading">Spotify</h2>

    @if (isSpotifyConnected()) {
      <p class="app-settings__text">Verbonden met Spotify.</p>

      <button class="app-settings__button app-settings__button--secondary" type="button" (click)="onSpotifyLogout()">
        Uitloggen bij Spotify
      </button>
    } @else {
      <p class="app-settings__text">Niet verbonden met Spotify.</p>

      <button class="app-settings__button" type="button" (click)="onSpotifyLogin()">Verbind met Spotify</button>
    }
  </section>

  <section class="app-settings__section" aria-labelledby="duration-heading">
    <h2 class="app-settings__heading" id="duration-heading">Afspeelduur</h2>

    <label class="app-settings__label">
      Seconden dat een nummer speelt ({{ minSeconds }} tot {{ maxSeconds }})
      <input
        class="app-settings__input"
        type="number"
        inputmode="numeric"
        [attr.aria-invalid]="durationError() ? 'true' : null"
        [attr.aria-describedby]="durationError() ? 'duration-error' : null"
        [formField]="settingsForm.seconds"
      />
    </label>

    @if (durationError(); as message) {
      <p class="app-settings__error" id="duration-error" role="alert">
        {{ message }} Niet opgeslagen: een nummer speelt nu {{ savedSeconds() }} seconden.
      </p>
    }
  </section>

  <app-players-section />

  <section class="app-settings__section" aria-labelledby="account-heading">
    <h2 class="app-settings__heading" id="account-heading">Account</h2>

    <button class="app-settings__button app-settings__button--secondary" type="button" (click)="onSignOut()">
      Uitloggen
    </button>
  </section>
</main>
