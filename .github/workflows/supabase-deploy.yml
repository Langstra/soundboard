name: Deploy Supabase

# Manual on purpose: this changes the production database and Edge Functions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      - name: Apply migrations
        # CLI v3: --remote targets the linked project and hosted changes need --yes in CI.
        run: supabase db push --remote --yes
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Verify Data API grants
        # Read-only. Newer Supabase projects do not grant the API roles on new tables, so fail the deploy if missing.
        run: |
          rows=$(supabase db query --remote --read-only -o json "select table_name, grantee, privilege_type from information_schema.role_table_grants where table_schema = 'public' and table_name in ('players', 'player_links') and grantee in ('authenticated', 'service_role')" 2>/dev/null)
          echo "$rows" | jq -c '.rows[]'
          echo "$rows" | jq -e '[.rows[] | select(.table_name == "players" and .grantee == "authenticated" and .privilege_type == "SELECT")] | length > 0' > /dev/null
          echo "$rows" | jq -e '[.rows[] | select(.table_name == "player_links" and .grantee == "service_role" and .privilege_type == "SELECT")] | length > 0' > /dev/null

      - name: Set Edge Function secrets
        run: supabase secrets set SPOTIFY_CLIENT_ID="$SPOTIFY_CLIENT_ID" SPOTIFY_CLIENT_SECRET="$SPOTIFY_CLIENT_SECRET" --yes
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --yes
