name: Deploy Supabase

# Manual on purpose: this changes the production database and Edge Functions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      - name: Apply migrations
        # CLI v3: --remote targets the linked project and hosted changes need --yes in CI.
        run: supabase db push --remote --yes
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Verify Data API grants
        # Read-only. Newer Supabase projects do not grant the API roles on new tables, so fail the deploy if missing.
        run: |
          raw=$(supabase db query --remote --read-only -o json "select has_table_privilege('authenticated', 'public.players', 'SELECT') as players_authenticated_select, has_table_privilege('anon', 'public.players', 'SELECT') as players_anon_select, has_table_privilege('service_role', 'public.player_links', 'SELECT') as links_service_role_select" 2>/dev/null)
          echo "$raw"
          # The result is either {rows: [...]} (local) or a bare array (hosted).
          row=$(echo "$raw" | jq -c 'if type == "array" then (if (.[0] | type) == "object" and (.[0] | has("rows")) then .[0].rows[0] else .[0] end) else .rows[0] end')
          echo "$row" | jq -e '.players_authenticated_select == true and .links_service_role_select == true' > /dev/null

      - name: Set Edge Function secrets
        run: supabase secrets set SPOTIFY_CLIENT_ID="$SPOTIFY_CLIENT_ID" SPOTIFY_CLIENT_SECRET="$SPOTIFY_CLIENT_SECRET" --yes
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      - name: Deploy Edge Functions
        run: supabase functions deploy --yes
